name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.41.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: rtco

jobs:
  verify-versions:
    name: Verify manifest versions match tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cargo.toml version == tag
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          TAG="${TAG#v}"
          CARGO=$(awk '/^\[package\]/{p=1; next} p && /^\[/{exit}
                       p && /^[[:space:]]*version[[:space:]]*=/{
                         match($0, /"[^"]+"/); print substr($0, RSTART+1, RLENGTH-2); exit }' Cargo.toml)
          echo "tag=$TAG  Cargo.toml=$CARGO"
          [ "$CARGO" = "$TAG" ] || { echo "::error::Cargo.toml ($CARGO) ≠ tag ($TAG)"; exit 1; }

  build:
    name: Build ${{ matrix.suffix }}
    needs: [verify-versions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            suffix: linux-x86_64
            ext: tar.gz
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            suffix: linux-aarch64
            ext: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-x86_64
            ext: tar.gz
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-aarch64
            ext: tar.gz
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86_64
            ext: zip
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 99b8069c4f4e89f835e7ef36b50fe9d72fde5d77

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package: tar.gz for Unix ──
      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-versions.outputs.tag }}"
          STAGE=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$STAGE/${BIN_NAME}"
          [ -f LICENSE ]   && cp LICENSE   "$STAGE/LICENSE"   || true
          [ -f README.md ] && cp README.md "$STAGE/README.md" || true
          ARCHIVE="${BIN_NAME}-${VERSION}-${{ matrix.suffix }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$STAGE" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      # ── Package: zip for Windows ──
      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $Version = "${{ needs.verify-versions.outputs.tag }}"
          $Stage   = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "stage-$Version") -Force
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" (Join-Path $Stage "$env:BIN_NAME.exe")
          if (Test-Path LICENSE)   { Copy-Item LICENSE   (Join-Path $Stage "LICENSE") }
          if (Test-Path README.md) { Copy-Item README.md (Join-Path $Stage "README.md") }

          $Archive = "$env:BIN_NAME-$Version-${{ matrix.suffix }}.zip"
          # Compress across the staged contents, not the dir itself, so the
          # archive root matches the tar.gz layout on the other targets
          # (binary at top level).
          Compress-Archive -Path (Join-Path $Stage '*') -DestinationPath $Archive -Force
          $hash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLower()
          # GNU sha256sum format so `sha256sum -c` and the install scripts
          # both parse the sidecar interchangeably.
          "$hash  $Archive" | Out-File -FilePath "$Archive.sha256" -Encoding ascii -NoNewline
          "ARCHIVE=$Archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.suffix }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [verify-versions, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( ${BIN_NAME}-*.tar.gz ${BIN_NAME}-*.zip )
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No archives found in artifacts/"
            ls -la
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-versions.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/${{ env.BIN_NAME }}-*.tar.gz
            artifacts/${{ env.BIN_NAME }}-*.tar.gz.sha256
            artifacts/${{ env.BIN_NAME }}-*.zip
            artifacts/${{ env.BIN_NAME }}-*.zip.sha256
            artifacts/SHA256SUMS
