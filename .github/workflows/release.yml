name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release

      - name: Detect platform
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)  os="linux" ;;
            macOS)  os="macos" ;;
            Windows) os="windows" ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch="x86_64" ;;
            aarch64|arm64) arch="aarch64" ;;
          esac
          echo "value=${os}-${arch}" >> "$GITHUB_OUTPUT"
          echo "ext=${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}" >> "$GITHUB_OUTPUT"

      - name: Compress binary
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          PLATFORM="${{ steps.platform.outputs.value }}"
          EXT="${{ steps.platform.outputs.ext }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cd target/release && 7z a "../../rtco-${VERSION}-${PLATFORM}.${EXT}" "rtco.exe" && cd ../..
          else
            tar czf "rtco-${VERSION}-${PLATFORM}.${EXT}" -C target/release rtco
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(rtco-*.tar.gz rtco-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No archive files found" && exit 1
          fi
          if command -v sha256sum &> /dev/null; then
            sha256sum "${files[@]}" > rtco-SHA256SUMS.txt
          elif command -v shasum &> /dev/null; then
            shasum -a 256 "${files[@]}" > rtco-SHA256SUMS.txt
          else
            echo "No SHA256 tool found" && exit 1
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rtco-*.tar.gz
            rtco-*.zip
            rtco-SHA256SUMS.txt
          generate_release_notes: true
