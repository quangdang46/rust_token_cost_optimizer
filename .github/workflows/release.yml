name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release

      - name: Compress binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cd target/release && 7z a "../../rtco-${{ matrix.os }}.zip" "rtco.exe" && cd ../..
          else
            tar czf "rtco-${{ matrix.os }}.tar.gz" -C target/release rtco
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum rtco-*.tar.gz rtco-*.zip > rtco-SHA256SUMS.txt
          elif command -v shasum &> /dev/null; then
            shasum -a 256 rtco-*.tar.gz rtco-*.zip > rtco-SHA256SUMS.txt
          else
            echo "No SHA256 tool found" && exit 1
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rtco-*.tar.gz
            rtco-*.zip
            rtco-SHA256SUMS.txt
          generate_release_notes: true
