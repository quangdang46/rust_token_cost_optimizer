name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: cargo build (for integration tests)
        run: cargo build

      - name: cargo test (ignored / integration)
        run: cargo test -- --ignored
        continue-on-error: true

      - name: cargo build --release
        run: cargo build --release

      - name: hyperfine benchmark
        shell: bash
        run: |
          if command -v hyperfine &> /dev/null; then
            hyperfine --warmup 3 ./target/release/rtco${{ runner.os == 'Windows' && '.exe' || '' }} --help
          else
            echo "hyperfine not installed, skipping benchmark"
          fi
        continue-on-error: true

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: cargo tarpaulin
        run: cargo tarpaulin --out Xml
        continue-on-error: true
