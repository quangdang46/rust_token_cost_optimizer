[workspace]
members = ["crates/rtco-core", "crates/rtco-cli"]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2021"
authors = ["Patrick Szymkowiak"]
license = "Apache 2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"
